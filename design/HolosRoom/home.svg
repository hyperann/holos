<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
<!--
  Holos Room · home at dusk — Art/HomeArt.swift ported to SVG.
  Room space 1000 × 700; every shape keeps its artFrame, Dusk colour and
  gradient, back to front as in the Swift ZStack. SF Symbols use the design
  kit's Phosphor stand-ins fitted to their own bounds, except two drawn here in
  SF style because the kit's stand-ins would misdraw the scene: mug.fill (the
  kit shows a tea bag) and figure.and.child.holdinghands (the kit shows a
  baby's face — in the family photo it must read as an adult and a child).
-->
<defs>
  <!-- RoomShell(wall: Dusk.homeWall, wallLow: Dusk.homeWallLow) -->
  <linearGradient id="wall" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="530"><stop offset="0" stop-color="#144545"/><stop offset="1" stop-color="#215954"/></linearGradient>
  <linearGradient id="floor" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="0" y2="700"><stop offset="0" stop-color="#784A2B"/><stop offset="1" stop-color="#4F2E1A"/></linearGradient>
  <!-- Glow: EllipticalGradient [c·s, c·s·0.35, clear], end radius 0.5 of its frame -->
  <radialGradient id="glowLamp48" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD180" stop-opacity=".48"/><stop offset=".5" stop-color="#FFD180" stop-opacity=".168"/><stop offset="1" stop-color="#FFD180" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowLamp30" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD180" stop-opacity=".3"/><stop offset=".5" stop-color="#FFD180" stop-opacity=".105"/><stop offset="1" stop-color="#FFD180" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowLamp55" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD180" stop-opacity=".55"/><stop offset=".5" stop-color="#FFD180" stop-opacity=".1925"/><stop offset="1" stop-color="#FFD180" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowScreen25" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#599EDB" stop-opacity=".25"/><stop offset=".5" stop-color="#599EDB" stop-opacity=".0875"/><stop offset="1" stop-color="#599EDB" stop-opacity="0"/></radialGradient>
  <!-- fridge, kitchen, kettle -->
  <linearGradient id="fridge" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="180" y2="0"><stop offset="0" stop-color="#E8EDE8"/><stop offset="1" stop-color="#BDC7C4"/></linearGradient>
  <linearGradient id="counter" gradientUnits="userSpaceOnUse" x1="0" y1="420" x2="0" y2="588"><stop offset="0" stop-color="#AD784D"/><stop offset="1" stop-color="#7A4F30"/></linearGradient>
  <linearGradient id="kettle" gradientUnits="userSpaceOnUse" x1="0" y1="346" x2="0" y2="412"><stop offset="0" stop-color="#CC4D3D"/><stop offset="1" stop-color="#9E3329"/></linearGradient>
  <!-- photo, television, floorLamp, frontDoor -->
  <linearGradient id="photo" gradientUnits="userSpaceOnUse" x1="0" y1="108" x2="0" y2="202"><stop offset="0" stop-color="#9ECCEB"/><stop offset="1" stop-color="#94C280"/></linearGradient>
  <linearGradient id="tv" gradientUnits="userSpaceOnUse" x1="628" y1="128" x2="802" y2="224"><stop offset="0" stop-color="#1F2E4D"/><stop offset="1" stop-color="#0D121F"/></linearGradient>
  <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="280" x2="0" y2="324"><stop offset="0" stop-color="#FFD180"/><stop offset="1" stop-color="#FA9E4D"/></linearGradient>
  <linearGradient id="doorSky" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="250"><stop offset="0" stop-color="#2B2661"/><stop offset=".5" stop-color="#99527A"/><stop offset="1" stop-color="#FA9E5C"/></linearGradient>
  <radialGradient id="vignette" cx=".5" cy=".5" r=".72"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient>
  <filter id="blur3" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="900"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="blur8" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="900"><feGaussianBlur stdDeviation="8"/></filter>
</defs>

<!-- RoomShell -->
<rect width="1000" height="530" fill="url(#wall)"/>
<rect y="520" width="1000" height="180" fill="url(#floor)"/>
<path fill="none" stroke="#3D2414" stroke-opacity=".5" stroke-width="2" d="M0 541.6H1000M0 568.6H1000M0 601H1000M0 642.4H1000M0 689.2H1000M180 520V541.6M520 520V541.6M830 520V541.6M330 541.6V568.6M710 541.6V568.6M100 568.6V601M470 568.6V601M900 568.6V601M270 601V642.4M640 601V642.4M50 642.4V689.2M410 642.4V689.2M780 642.4V689.2"/>
<rect y="512" width="1000" height="14" fill="#0A262B"/>

