<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
<!--
  Holos Room · the hospital ward at dusk — Art/WardArt.swift ported to SVG.
  Room space 1000 × 700, exactly as RoomSpace; every shape keeps its artFrame
  (x, y, width, height), its Dusk colour (Art/ArtKit.swift, sRGB 0–1 → hex)
  and its gradient. Order follows the Swift ZStack, back to front.
  SF Symbols in the drawing use the design kit's Phosphor stand-ins, fitted to
  their own bounds the way .resizable().scaledToFit() fits a symbol.
-->
<defs>
  <!-- RoomShell -->
  <linearGradient id="wall" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="530"><stop offset="0" stop-color="#0F4047"/><stop offset="1" stop-color="#1A5459"/></linearGradient>
  <linearGradient id="floor" gradientUnits="userSpaceOnUse" x1="0" y1="520" x2="0" y2="700"><stop offset="0" stop-color="#784A2B"/><stop offset="1" stop-color="#4F2E1A"/></linearGradient>
  <!-- Glow: EllipticalGradient [c·s, c·s·0.35, clear], end radius 0.5 of its frame -->
  <radialGradient id="glowLamp42" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD180" stop-opacity=".42"/><stop offset=".5" stop-color="#FFD180" stop-opacity=".147"/><stop offset="1" stop-color="#FFD180" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowScreen35" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#599EDB" stop-opacity=".35"/><stop offset=".5" stop-color="#599EDB" stop-opacity=".1225"/><stop offset="1" stop-color="#599EDB" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowLamp60" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD180" stop-opacity=".6"/><stop offset=".5" stop-color="#FFD180" stop-opacity=".21"/><stop offset="1" stop-color="#FFD180" stop-opacity="0"/></radialGradient>
  <!-- window -->
  <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="82" x2="0" y2="298"><stop offset="0" stop-color="#2B2661"/><stop offset=".5" stop-color="#99527A"/><stop offset="1" stop-color="#FA9E5C"/></linearGradient>
  <linearGradient id="curtainL" gradientUnits="userSpaceOnUse" x1="26" y1="0" x2="96" y2="0"><stop offset="0" stop-color="#D1754D"/><stop offset="1" stop-color="#994730"/></linearGradient>
  <linearGradient id="curtainR" gradientUnits="userSpaceOnUse" x1="244" y1="0" x2="314" y2="0"><stop offset="0" stop-color="#D1754D"/><stop offset="1" stop-color="#994730"/></linearGradient>
  <!-- phoneShelf, doorway, bed, bedsideTable -->
  <linearGradient id="phoneScreen" gradientUnits="userSpaceOnUse" x1="0" y1="164" x2="0" y2="240"><stop offset="0" stop-color="#599EDB"/><stop offset="1" stop-color="#3D668F"/></linearGradient>
  <linearGradient id="corridor" gradientUnits="userSpaceOnUse" x1="0" y1="98" x2="0" y2="526"><stop offset="0" stop-color="#FFF0CC"/><stop offset="1" stop-color="#EDCC99"/></linearGradient>
  <linearGradient id="blanket" gradientUnits="userSpaceOnUse" x1="0" y1="404" x2="0" y2="496"><stop offset="0" stop-color="#5C8CB5"/><stop offset="1" stop-color="#3D668F"/></linearGradient>
  <linearGradient id="table" gradientUnits="userSpaceOnUse" x1="0" y1="420" x2="0" y2="586"><stop offset="0" stop-color="#AD784D"/><stop offset="1" stop-color="#7A4F30"/></linearGradient>
  <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="312" x2="0" y2="356"><stop offset="0" stop-color="#FFD180"/><stop offset="1" stop-color="#FA9E4D"/></linearGradient>
  <!-- Vignette: clear to 0.6, black 0.38 at 1, end radius 0.72 of the room -->
  <radialGradient id="vignette" cx=".5" cy=".5" r=".72"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient>
  <!-- .blur(radius:) — the region spans the room so no blur is clipped -->
  <filter id="blur3" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="900"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="blur8" filterUnits="userSpaceOnUse" x="-100" y="-100" width="1200" height="900"><feGaussianBlur stdDeviation="8"/></filter>
</defs>

<!-- RoomShell: wall, floor, floorboards, skirting -->
<rect width="1000" height="530" fill="url(#wall)"/>
<rect y="520" width="1000" height="180" fill="url(#floor)"/>
