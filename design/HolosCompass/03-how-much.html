<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Compass · How much?</title>
<link rel="stylesheet" href="../kit/kit.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-device="ipad" data-statusbar="light" class="compass">
<div class="safe app">
  <header class="topbar">
    <span class="needle" data-size="34" data-dir="north"></span>
    <div class="tb-text">
      <div class="tb-name"><span>Holos</span><span class="sub">Compass</span></div>
      <div class="tb-step">Step 2 of 4 · Four choices, any sentence</div>
    </div>
    <div class="dots"><span class="on"></span><span class="on"></span><span></span><span></span></div>
    <div class="tb-spacer"></div>
    <span class="langtoggle"><span class="on">EN</span><span>УКР</span></span>
    <span class="gear"><i data-sf="gearshape.fill"></i></span>
  </header>

  <main class="step compose">
    <div class="compose-geo">
      <div class="goal-scroller">
        <div class="goal card">
          <h2 class="goal-title">Say this to the nurse</h2>
          <div class="goal-line"><i data-sf="1.circle.fill"></i><span>My head hurts a lot.</span></div>
          <div class="goal-line"><i data-sf="2.circle.fill"></i><span>I need medicine, please.</span></div>
          <p class="howto">The light sweeps clockwise — up, right, down, left, the centre, then the buttons under it. Press when it reaches the choice you want. The marked choice shows the way.</p>
        </div>
      </div>
      <div id="dial"></div>
    </div>
  </main>
</div>
<script src="../kit/icons.js"></script><script src="../kit/kit.js"></script><script src="compass.js"></script>
<script>
  // ComposeStep, deeper in sentence 1: I feel › Pain › Head has opened the "How much?"
  // level. The hub shows the trail and the yellow draft; the scan has reached South,
  // "A lot", which also carries the "Next" tag (the last step to "My head hurts a lot.").
  Compass.ready(() => {
    const geo = document.querySelector(".compose-geo").getBoundingClientRect();
    const goalW = Math.min(360, geo.width * 0.3);
    document.querySelector(".goal-scroller").style.width = goalW + "px";
    Compass.dial(document.getElementById("dial"), {
      width: geo.width - goalW - 20, height: geo.height,
      trail: ["feel", "pain", "pain.head"], lit: "south", guide: "south", message: "",
    });
  });
</script>
</body></html>
